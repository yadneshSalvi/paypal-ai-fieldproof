<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000"><rect width="900" height="1000" fill="#f8f6ee"/><rect x="0" y="0" width="900" height="12" fill="#a74c3b"/><text x="63" y="62" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#a74c3b">FIELDPROOF / COMMUNITY SOURCE PACK</text><text x="63" y="112" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#a74c3b">Review the right things</text><text x="63" y="151" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263e40">The Neighbour Table supply drive</text><text x="63" y="182" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#a74c3b">SAMPLE · FICTIONAL · ILLUSTRATIVE · NO PHYSICAL WORK CLAIMED</text><text x="63" y="260" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#a74c3b">FOR WORKFLOW PRACTICE ONLY</text><text x="63" y="302" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#263e40">This is not a qualification or an inspection record.</text><text x="78" y="365" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263e40">01  Supply handling and distribution review</text><text x="78" y="409" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263e40">02  Food handling review</text><text x="78" y="453" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263e40">03  Pack contents and handling review</text><text x="78" y="497" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263e40">04  Electrical safety inspection</text><text x="78" y="541" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263e40">05  Cold-storage food handling review</text><text x="78" y="585" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263e40">06  Delivery and handover review</text><text x="78" y="629" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263e40">07  Collection-point access review</text><text x="63" y="770" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263e40">A real reviewer must supply appropriate authority and inspect the actual conditions.</text><text x="63" y="798" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263e40">The template does not name a qualified person. An organizer can practice the review</text><text x="63" y="826" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263e40">workflow with this visibly fictional source, but cannot turn it into a human</text><text x="63" y="854" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263e40">inspection.</text><text x="63" y="981" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#263e40">Editable authored source · Template v1 · Amounts in USD · Not a supplier offer</text></svg>
